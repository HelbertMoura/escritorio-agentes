<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Bairro dos escritórios</title>
  <link rel="stylesheet" href="/visita.css">
</head>
<body>
  <main class="mundo">
    <p class="marca">ESCRITÓRIO DOS AGENTES</p>
    <h1>Bairro dos escritórios</h1>
    <p>Clique na porta do chalé com a placa para entrar na recepção. Os chalés vizinhos ainda são só cenário.</p>
    <canvas id="mundo" width="320" height="180" role="img" aria-label="Bairro com o chalé deste escritório, rua, pessoas, cachorro, carro e céu do horário atual"></canvas>
    <p id="mundo-estado" role="status">Carregando o bairro…</p>
    <button id="entrar" type="button">Entrar na recepção</button>
  </main>
  <script src="/ceu.js"></script>
  <script src="/clima.js"></script>
  <script src="/mundo.js"></script>
</body>
</html>
